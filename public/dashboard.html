<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交明日计划 - 团队日报系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <h2>📋 团队日报系统</h2>
  <div>
    <span class="user-info" id="userInfo"></span>
    <button class="btn btn-default btn-sm" onclick="goAdmin()">汇总查看</button>
    <button class="btn btn-danger btn-sm" onclick="doLogout()">退出</button>
  </div>
</nav>

<div class="container" style="align-items:flex-start;padding-top:24px;">
  <div class="card wide-card" style="max-width:560px;">
    <h1>提交明日计划</h1>
    <p class="subtitle" id="todayDate"></p>

    <div class="form-group">
      <label>🌡 明日工作里程</label>
      <textarea id="mileage" rows="2" placeholder="请填写明日计划工作里程（如：K26+100～K30+000段路基碾压）..."></textarea>
    </div>

    <div class="form-group">
      <label>📝 明日工作内容</label>
      <textarea id="content" rows="5" placeholder="请填写明日主要工作内容..."></textarea>
    </div>

    <button class="btn btn-primary" id="submitBtn" onclick="doSubmit()">提交明日计划</button>
    <button class="btn btn-warning" id="updateBtn" onclick="doUpdate()" style="display:none;">保存修改</button>
    <p id="msg" class="success"></p>
    <p id="err" class="error"></p>

    <div id="alreadyBox" style="display:none;margin-top:16px;padding:14px;background:#fffbe6;border-radius:8px;border:1px solid #ffe58f;">
      <p style="color:#faad14;font-weight:600;">📌 今日已提交（可修改后重新保存）</p>
      <p style="margin-top:4px;font-size:12px;color:#999;" id="submittedTime"></p>
    </div>
  </div>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
