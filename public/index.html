<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富加监理二标日报系统 - 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card login-card">
      <h1>📋 富加监理二标日报系统</h1>
      <p class="subtitle" id="pageSubtitle">登录后提交每日工作日报</p>

      <!-- 成员登录 -->
      <div id="memberLogin">
        <div class="form-group">
          <label for="name">姓名</label>
          <select id="name">
            <option value="">-- 请选择姓名 --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()" />
        </div>
        <button id="loginBtn" class="btn btn-primary" onclick="doLogin()">登 录</button>
      </div>

      <!-- 管理员登录切换 -->
      <div style="text-align:center;margin-top:16px;">
        <a href="javascript:void(0)" id="toggleAdmin" onclick="toggleAdminLogin()" style="color:#1677ff;font-size:13px;">🔑 管理员登录</a>
      </div>

      <!-- 管理员登录 -->
      <div id="adminLogin" style="display:none;margin-top:10px;">
        <div class="form-group">
          <label for="adminName">管理员账号</label>
          <input type="text" id="adminName" placeholder="请输入管理员账号" />
        </div>
        <div class="form-group">
          <label for="adminPassword">管理员密码</label>
          <input type="password" id="adminPassword" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')doAdminLogin()" />
        </div>
        <button class="btn btn-primary" onclick="doAdminLogin()">管理员登录</button>
        <div style="text-align:center;margin-top:8px;">
          <a href="javascript:void(0)" onclick="toggleAdminLogin()" style="color:#888;font-size:12px;">← 返回成员登录</a>
        </div>
      </div>

      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <!-- 网站运行时间 -->
  <div id="uptimeBar" style="position:fixed;bottom:8px;right:12px;font-size:11px;color:#bbb;z-index:999;"></div>

  <script src="js/login.js"></script>
</body>
</html>
