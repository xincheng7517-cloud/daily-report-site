<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队计划系统 - 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card login-card">
      <h1>📋 团队计划系统</h1>
      <p class="subtitle">登录后提交明日工作计划</p>
      <div class="form-group">
        <label for="name">姓名</label>
        <select id="name">
          <option value="">-- 请选择姓名 --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button id="loginBtn" class="btn btn-primary" onclick="doLogin()">登 录</button>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
